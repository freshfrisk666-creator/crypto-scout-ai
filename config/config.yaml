project:
  name: "crypto-scout-ai"
  version: "1.1.0"
  mode: "PAPER"

market:
  universe_size: 200
  exchange: "binance"
  quote_currency: "USDT"

  stablecoin_exclusions:
    - USDT
    - USDC
    - DAI
    - FDUSD
    - USDE
    - TUSD
    - USDS
    - USDD
    - PYUSD
    - USD1
    - USDG
    - RLUSD
    - U
    - FRAX
    - GUSD
    - LUSD
    - USDP
    - BUSD
    - USTC
    - CRVUSD

  stablecoin_name_keywords:
    - "stablecoin"
    - "stables"
    - "usd coin"

  tokenized_commodity_exclusions:
    - XAUT
    - PAXG
    - KAU
    - KAG
    - XAUM
    - PMGT
    - DGX
    - VNXAU

  regime_timeframe: "15m"
  setup_timeframe: "5m"
  entry_timeframe: "1m"

  # Legacy keys retained temporarily until the scanner is migrated.
  signal_timeframe: "5m"
  monitor_timeframe: "1m"
  signal_bars: 250
  min_avg_dollar_volume: 1000000

  min_quote_volume_24h_usdt: 10000000
  max_spread_bps: 10

strategy:
  type: "SCALP"
  atr_period: 14

  stop_atr_multiple: 1.0
  target_atr_multiple: 1.5
  max_holding_minutes: 30
  cooldown_minutes: 15

  starting_cash: 10000.0
  max_positions: 3
  risk_per_trade_pct: 0.25
  max_position_notional_pct: 0.10

  # Initial entry hypothesis, to be tested.
  regime_ema_fast: 20
  regime_ema_slow: 50
  setup_ema_fast: 9
  setup_ema_slow: 21
  rsi_min: 50
  rsi_max: 70
  min_volume_ratio: 1.2
  breakout_lookback: 5

scoring:
  scalp_weights:
    trend: 0.30
    setup: 0.25
    rsi: 0.15
    volume: 0.15
    breakout: 0.15

costs:
  # Provisional simulation assumptions, not a fee quote.
  fee_rate_per_side: 0.001
  slippage_rate_per_side: 0.0005

portfolio:
  max_positions: 3
  replace_open_positions: false

monitor:
  mode: "websocket"
  reconnect_max_delay_seconds: 30
  close_on_time_limit: true
  check_stop: true
  check_target: true

data:
  coingecko_url: "https://api.coingecko.com/api/v3/coins/markets"
  timeout_seconds: 20
  ohlcv_limit: 250

safety:
  paper_trading_only: true
  live_orders_enabled: false
  leverage_enabled: false
